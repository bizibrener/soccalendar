<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ team.name }} – Soccalendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #8892a4;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: #fff; }

        .hero {
            text-align: center;
            padding: 60px 20px 30px;
            position: relative;
        }

        .hero img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .hero p {
            margin-top: 8px;
            color: #8892a4;
            font-size: 1.05rem;
        }

        .subscribe-section {
            max-width: 440px;
            width: 100%;
            padding: 0 24px;
            margin-top: 30px;
        }

        .subscribe-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #cbd5e0;
            margin-bottom: 16px;
            text-align: center;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .btn svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .btn-google { background: rgba(66, 133, 244, 0.15); }
        .btn-apple { background: rgba(255, 255, 255, 0.08); }
        .btn-outlook { background: rgba(0, 120, 212, 0.15); }
        .btn-copy { background: rgba(67, 233, 123, 0.1); cursor: pointer; }

        .btn-copy .copied {
            display: none;
            color: #43e97b;
        }

        .btn-copy.show-copied .label { display: none; }
        .btn-copy.show-copied .copied { display: inline; }

        .divider {
            text-align: center;
            color: #4a5568;
            font-size: 0.85rem;
            margin: 20px 0;
        }

        .url-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 0.85rem;
            color: #8892a4;
            word-break: break-all;
            text-align: center;
            line-height: 1.5;
        }

        footer {
            margin-top: auto;
            padding: 40px 20px;
            color: #4a5568;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <a class="back-link" href="/">&larr; All teams</a>

    <div class="hero">
        <img src="{{ team.crest }}" alt="{{ team.name }}">
        <h1>{{ team.name }}</h1>
        <p>Subscribe to get every match in your calendar</p>
    </div>

    <div class="subscribe-section">
        <h2>Pick your calendar app</h2>

        <a class="btn btn-google" href="https://calendar.google.com/calendar/render?cid={{ webcal_url }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" fill="#4285F4"/><path d="M12 7v5l3.5 2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
            Google Calendar
        </a>

        <a class="btn btn-apple" href="{{ webcal_url }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" fill="#555"/><path d="M12 7v5l3.5 2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
            Apple Calendar
        </a>

        <a class="btn btn-outlook" href="https://outlook.live.com/owa/?rru=addsubscription&name={{ team.name | urlencode }}&url={{ webcal_url | urlencode }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" fill="#0078D4"/><path d="M12 7v5l3.5 2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
            Outlook
        </a>

        <div class="divider">or copy the link manually</div>

        <a class="btn btn-copy" id="copy-btn" onclick="copyUrl(event)">
            <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="#43e97b" stroke-width="1.5"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" stroke="#43e97b" stroke-width="1.5"/></svg>
            <span class="label">Copy calendar URL</span>
            <span class="copied">Copied!</span>
        </a>

        <div class="url-box" id="cal-url">{{ https_url }}</div>
    </div>

    <footer>Soccalendar</footer>

    <script>
        function copyUrl(e) {
            e.preventDefault();
            const url = document.getElementById('cal-url').textContent;
            navigator.clipboard.writeText(url);
            const btn = document.getElementById('copy-btn');
            btn.classList.add('show-copied');
            setTimeout(() => btn.classList.remove('show-copied'), 2000);
        }
    </script>
</body>
</html>
